name: Luminance gate

# Ten seeded frames on software GL, measured against the budgets in scripts/frames.mjs. It takes
# 17 to 40 minutes on a GitHub runner, so it is not a gate on main or on the Pages deploy: it runs
# on pull requests that touch the renderer or the script, and by hand from the Actions tab.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/render/**'
      - 'scripts/frames.mjs'
      - '.github/workflows/frames.yml'

permissions:
  contents: read

concurrency:
  group: frames-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frames:
    name: Luminance gate
    runs-on: ubuntu-latest
    # Ten frames on software GL: about 680 renders at roughly a second each (17 minutes measured).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # Ten seeded frames on software GL, measured against the budgets in scripts/frames.mjs.
      - run: pnpm frames
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frames
          path: node_modules/.cache/ringfall-frames
          retention-days: 7
