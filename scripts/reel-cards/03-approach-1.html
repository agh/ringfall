<!doctype html>
<html lang="en">
  <head>
    <title>Ringfall approach card one</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <style>
      /* Tokens from docs/brand.md; fallbacks match src/style.css. */
      :root {
        --abyss: #0b1a2e;
        --beacon: #7dd3fc;
        --flare: #fbbf24;
        --dawn: #f6b26b;
        --ring: #b8d8ea;
        --bone: #e8e4d8;
        --rose: #fb7185;
        --hull: #101f36;
        --slate: #8aa0b8;
        --font-display: "Chakra Petch", "Rajdhani", "Bahnschrift", "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: var(--abyss);
        color: var(--bone);
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .card {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 900px 420px at 50% 118%, rgba(246, 178, 107, 0.22), transparent 70%),
          linear-gradient(180deg, var(--abyss) 0%, #0d2140 55%, var(--hull) 100%);
      }
      .card--night {
        background:
          radial-gradient(ellipse 900px 420px at 50% 118%, rgba(125, 211, 252, 0.08), transparent 70%),
          linear-gradient(180deg, #050b16 0%, var(--abyss) 60%, var(--hull) 100%);
      }
      /* The ring crossing overhead: a thin arc of Ring, rising slowly over the card. */
      .arc {
        position: absolute;
        left: 50%;
        top: -1120px;
        width: 2600px;
        height: 1500px;
        margin-left: -1300px;
        border: 34px solid rgba(184, 216, 234, 0.16);
        border-radius: 50%;
        box-shadow: inset 0 0 0 2px rgba(184, 216, 234, 0.25);
        animation: arc-rise 12s linear both;
      }
      .arc--low {
        top: -1030px;
      }
      /* A handful of stars, more at night. */
      .stars {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(1px 1px at 120px 80px, rgba(232, 228, 216, 0.7), transparent 2px),
          radial-gradient(1px 1px at 420px 50px, rgba(232, 228, 216, 0.5), transparent 2px),
          radial-gradient(1.5px 1.5px at 760px 120px, rgba(232, 228, 216, 0.6), transparent 2px),
          radial-gradient(1px 1px at 1010px 70px, rgba(232, 228, 216, 0.55), transparent 2px),
          radial-gradient(1px 1px at 1180px 160px, rgba(232, 228, 216, 0.5), transparent 2px),
          radial-gradient(1px 1px at 300px 200px, rgba(232, 228, 216, 0.35), transparent 2px),
          radial-gradient(1.5px 1.5px at 900px 230px, rgba(232, 228, 216, 0.45), transparent 2px);
      }
      .card--night .stars {
        opacity: 1;
        filter: brightness(1.4);
      }
      /* The datum: one Beacon line, the "manufactured by the same people" tell. */
      .datum {
        position: absolute;
        left: 120px;
        right: 120px;
        top: 590px;
        height: 1px;
        background: linear-gradient(90deg, var(--beacon), rgba(125, 211, 252, 0.15));
        transform-origin: left center;
        animation: ignite 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .datum::after {
        content: "";
        position: absolute;
        left: 0;
        top: -2px;
        width: 48px;
        height: 5px;
        background: var(--beacon);
        box-shadow: 0 0 12px rgba(125, 211, 252, 0.8);
      }
      .copy {
        position: absolute;
        left: 120px;
        right: 120px;
        top: 50%;
        transform: translateY(-50%);
        max-width: 960px;
      }
      .copy--centre {
        text-align: center;
        max-width: none;
      }
      .eyebrow {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 20px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--slate);
        margin: 0 0 18px;
      }
      .wordmark {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 120px;
        line-height: 1;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--bone);
        margin: 0 0 22px;
        text-shadow: 0 0 40px rgba(125, 211, 252, 0.25);
      }
      .heading {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 56px;
        line-height: 1.1;
        color: var(--bone);
        margin: 0 0 26px;
      }
      .body {
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 30px;
        line-height: 1.5;
        color: var(--bone);
        margin: 0;
        max-width: 44ch;
      }
      .body--muted {
        color: var(--ring);
      }
      .mono {
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 28px;
        line-height: 1.6;
        color: var(--ring);
        margin: 0;
      }
      .accent {
        color: var(--dawn);
      }
      .accent--night {
        color: var(--beacon);
      }
      .corner {
        position: absolute;
        right: 120px;
        bottom: 54px;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--slate);
      }
      /* Motion: fade and a slow rise, staggered. */
      .rise {
        opacity: 0;
        animation: rise 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .rise--2 {
        animation-delay: 0.35s;
      }
      .rise--3 {
        animation-delay: 0.7s;
      }
      .rise--4 {
        animation-delay: 1.05s;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(28px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes ignite {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @keyframes arc-rise {
        from {
          transform: translateY(26px);
        }
        to {
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="stars"></div>
      <div class="arc arc--low"></div>
      <section class="copy">
        <p class="eyebrow rise">The approach</p>
        <h2 class="heading rise rise--2">Built in one morning.</h2>
        <p class="body rise rise--3">
          The simulation is a pure function with a seeded random source.
        </p>
        <p class="body body--muted rise rise--4" style="margin-top: 28px">
          The same step drives the game, a bot that plays it, the tests, and this film.
        </p>
      </section>
      <div class="datum"></div>
      <p class="corner rise rise--4">TypeScript · three.js · WebGL 2</p>
    </main>
  </body>
</html>
