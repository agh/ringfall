repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.12
    hooks:
      - id: biome-check
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
  - repo: https://github.com/vale-cli/vale
    rev: v3.24.0
    hooks:
      - id: vale
        args: [--no-global]
        types: [markdown]
  - repo: local
    hooks:
      - id: check-frontmatter
        name: Validate docs frontmatter against docs/frontmatter.schema.json
        entry: node scripts/check-frontmatter.mjs
        language: system
        files: ^(README\.md|docs/.*\.md)$
        pass_filenames: false
