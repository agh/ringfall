# Vendored from crefft configs/vale/Crefft/.vale.ini at commit
# 6e6481840e68a89874e0d90eaae3cf23e83379fb (2026-10-18), with the package's
# rules copied into styles/Crefft/ instead of fetched by `vale sync`.
# Every invocation uses --no-global so workstation settings cannot change the gate.
StylesPath = styles
MinAlertLevel = warning

IgnoredScopes = code, tt
SkippedScopes = script, style, pre, blockquote

[*.md]
BasedOnStyles = Vale, Crefft
Vale.Spelling = NO
